<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
    }
    
    .card-shadow {
      box-shadow: 0px 8px 32px rgba(1, 45, 29, 0.08);
    }
    
    .islamic-pattern-subtle {
      background-image: radial-gradient(circle at 1px 1px, rgba(1, 45, 29, 0.03) 1px, transparent 0);
      background-size: 32px 32px;
    }

    /* Animated Gradient Background */
    .animated-bg {
      background: linear-gradient(-45deg, #E8F0E9, #f4fafd, #FCF9F5, #eef5f7);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating Accents */
    .floating-accents {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
    }

    .accent-shape {
      position: absolute;
      background: currentColor;
      border-radius: 50%;
      opacity: 0.1;
      filter: blur(40px);
      will-change: transform;
    }

    @keyframes float {
      0% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -50px) rotate(10deg); }
      66% { transform: translate(-20px, 20px) rotate(-10deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    body {
      height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .lang-switcher {
      position: fixed;
      top: 1rem;
      right: 1rem;
      left: auto;
      z-index: 50;
    }

    .lang-menu {
      display: none;
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      left: auto;
      min-width: 140px;
    }

    .lang-switcher.is-open .lang-menu {
      display: block;
    }

    .lang-option.is-active {
      background-color: rgba(1, 45, 29, 0.08);
      color: #012d1d;
      font-weight: 600;
    }

    [dir="rtl"] .arrow-icon {
      transform: scaleX(-1);
    }

    [dir="rtl"] .group:hover .arrow-icon {
      transform: scaleX(-1) translateX(-0.25rem);
    }

    [dir="ltr"] .group:hover .arrow-icon {
      transform: translateX(0.25rem);
    }
  </style>

<body class="animated-bg font-body-md text-on-surface m-0">

    </p>

<script>
  const translations = {
    ar: {
      pageTitle: 'مركز التبرعات | الإدارة المقدسة',
      siteTitle: 'مركز التبرعات',
      siteSubtitle: 'اختر تطبيق التبرعات',
      cardImageAlt: 'رسم توضيحي لمسجد بقبة خضراء ومئذنة وفناء',
      cardTitlePrimary: 'مساجد',
      cardTitleSecondary: 'Masajid',
      cardDescription: 'التبرعات العينية للمساجد والمرافق الإسلامية',
      cardAction: 'استكشف المزيد',
      footer: 'منظومة الإدارة المقدسة',
      langToggleLabel: 'تغيير اللغة'
    },
    en: {
      pageTitle: 'Donations Hub | Sacred Stewardship',
      siteTitle: 'Donations Hub',
      siteSubtitle: 'Select a donations application',
      cardImageAlt: 'Isometric illustration of a mosque with green dome, minaret, and courtyard',
      cardTitlePrimary: 'مساجد',
      cardTitleSecondary: 'Masajid',
      cardDescription: 'Physical donations for mosques and Islamic facilities',
      cardAction: 'Explore More',
      footer: 'Sacred Stewardship Ecosystem',
      langToggleLabel: 'Change language'
    }
  };

  const DEFAULT_LANG = 'ar';
  const STORAGE_KEY = 'donations-hub-lang';

  function getStoredLang() {
    const stored = localStorage.getItem(STORAGE_KEY);
    return stored === 'en' || stored === 'ar' ? stored : DEFAULT_LANG;
  }

  function setLanguage(lang) {
    const strings = translations[lang];
    if (!strings) return;

    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = strings.pageTitle;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (strings[key] !== undefined) el.textContent = strings[key];
    });

    document.querySelectorAll('[data-i18n-alt]').forEach(el => {
      const key = el.getAttribute('data-i18n-alt');
      if (strings[key] !== undefined) el.alt = strings[key];
    });

    document.getElementById('lang-toggle').setAttribute('aria-label', strings.langToggleLabel);

    document.querySelectorAll('.lang-option').forEach(btn => {
      const isActive = btn.dataset.lang === lang;
      btn.classList.toggle('is-active', isActive);
      btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });

    localStorage.setItem(STORAGE_KEY, lang);
  }

  function initLanguageSwitcher() {
    const switcher = document.getElementById('lang-switcher');
    const toggle = document.getElementById('lang-toggle');
    const menu = document.getElementById('lang-menu');

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = switcher.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    menu.querySelectorAll('.lang-option').forEach(btn => {
      btn.addEventListener('click', () => {
        setLanguage(btn.dataset.lang);
        switcher.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });

    document.addEventListener('click', () => {
      switcher.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        switcher.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    setLanguage(getStoredLang());
    initLanguageSwitcher();

    const shapes = document.querySelectorAll('.accent-shape');
    shapes.forEach(shape => {
      const delay = Math.random() * -20;
      shape.style.animationDelay = `${delay}s`;
    });
  });
</script>
